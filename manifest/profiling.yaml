kind: Deployment
apiVersion: apps/v1
metadata:
  name: profiling-app
  labels:
    app: profiling-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profiling-app
  template:
    metadata:
      labels:
        app: profiling-app
    spec:
      containers:
        - name: profiling-app
          image: default-route-openshift-image-registry.apps.rm1.0a51.p1.openshiftapps.com/merisaa-dev/profiling-gwe:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              protocol: TCP
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI
            - name: MONGO_DB_NAME
              value: "bootcamp"
---
kind: Service
apiVersion: v1
metadata:
  name: profiling-app
  labels:
    app: profiling-app
spec:
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  selector:
    app: profiling-app