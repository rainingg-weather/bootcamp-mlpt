---
- name: Install and configure MongoDB
  hosts: all
  become: true

  tasks:

    - name: Update DNF cache
      ansible.builtin.dnf:
        update_cache: true

    - name: Install MongoDB
      ansible.builtin.dnf:
        name: mongodb-org
        state: present

    - name: Create MongoDB data directory
      ansible.builtin.file:
        path: /var/lib/mongo
        state: directory
        owner: mongod
        group: mongod
        mode: "0755"

    - name: Create MongoDB log directory
      ansible.builtin.file:
        path: /var/log/mongodb
        state: directory
        owner: mongod
        group: mongod
        mode: "0755"

    - name: Fix SELinux port for MongoDB
      ansible.builtin.command:
        cmd: semanage port -a -t mongod_port_t -p tcp 27017
      failed_when: false
      changed_when: false

    - name: Restore SELinux context for MongoDB directories
      ansible.builtin.command:
        cmd: restorecon -Rv /var/lib/mongo /var/log/mongodb
      failed_when: false
      changed_when: false

    - name: Check MongoDB configuration
      ansible.builtin.command:
        cmd: mongod --config /etc/mongod.conf --configExpand
      register: mongodb_config_check
      changed_when: false
      failed_when: false

    - name: Enable MongoDB service
      ansible.builtin.systemd:
        name: mongod
        enabled: true
        daemon_reload: true

    - name: Start MongoDB service
      ansible.builtin.systemd:
        name: mongod
        state: started

    - name: Wait for MongoDB port 27017
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 27017
        state: started
        delay: 5
        timeout: 120

    - name: Check MongoDB service status
      ansible.builtin.command:
        cmd: systemctl is-active mongod
      register: mongodb_status
      changed_when: false
      failed_when: false

    - name: Display MongoDB service status
      ansible.builtin.debug:
        msg: "MongoDB service status: {{ mongodb_status.stdout }}"

    - name: Check MongoDB listening port
      ansible.builtin.command:
        cmd: ss -lntp
      register: mongodb_ports
      changed_when: false
      failed_when: false

    - name: Display listening ports
      ansible.builtin.debug:
        var: mongodb_ports.stdout_lines

    - name: Get MongoDB logs
      ansible.builtin.command:
        cmd: journalctl -u mongod -n 50 --no-pager
      register: mongodb_logs
      changed_when: false
      failed_when: false

    - name: Display MongoDB logs
      ansible.builtin.debug:
        var: mongodb_logs.stdout_lines

    - name: Verify MongoDB is running
      ansible.builtin.assert:
        that:
          - mongodb_status.stdout == "active"
        fail_msg: "MongoDB gagal berjalan. Silakan lihat MongoDB logs di atas."
        success_msg: "MongoDB berhasil berjalan dan port 27017 tersedia."