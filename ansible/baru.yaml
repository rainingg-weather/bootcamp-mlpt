---
- name: Setup environment, developer tooling, and MongoDB
  hosts: all
  become: false

  vars:
    # --- Exact Tool Versions (Pinning) ---
    git_version: "2.43.5"
    podman_version: "4.9.4"
    python_version: "3.11.5"
    oc_version: "4.14.16"

    # URL rilis OpenShift Client
    oc_cli_download_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/{{ oc_version }}/openshift-client-linux-{{ oc_version }}.tar.gz"

    git_repo_url: "https://github.com/ansible/ansible-examples.git"
    git_dest: "{{ ansible_env.HOME }}/repo"

    podman_registry_url: "quay.io"
    podman_registry_username: ""
    podman_registry_password: ""

    oc_api_url: "https://api.example.com:6443"
    oc_token: ""

  tasks:
    # =========================================================================
    # 01. PRE-VALIDATION INPUTS
    # =========================================================================
    - name: Pre-validation input parameters
      ansible.builtin.assert:
        that:
          - git_repo_url is defined and git_repo_url | trim | length > 0
          - git_dest is defined and git_dest | trim | length > 0
          - podman_registry_url is defined and podman_registry_url | trim | length > 0
          - podman_registry_username is defined and podman_registry_username | trim | length > 0
          - podman_registry_password is defined and podman_registry_password | trim | length > 0
          - oc_api_url is defined and oc_api_url is match('^https://')
          - oc_token is defined and oc_token | trim | length > 0
        fail_msg: "Validasi gagal: Pastikan semua kredensial, URL repository, dan konfigurasi OCP telah diisi!"
        success_msg: "Pre-validation berhasil. Semua parameter wajib telah tersedia."

    # =========================================================================
    # 02. SETUP REPOSITORY & SYSTEM PACKAGES (ROOT PRIVILEGE)
    # =========================================================================
    - name: Add MongoDB official repository
      ansible.builtin.yum_repository:
        name: mongodb-org-8.0
        description: MongoDB Repository
        baseurl: https://repo.mongodb.org/yum/redhat/9/mongodb-org/8.0/x86_64/
        gpgcheck: true
        enabled: true
        gpgkey: https://www.mongodb.org/static/pgp/server-8.0.asc
      become: true

    - name: Install system packages, developer tools, and MongoDB
      ansible.builtin.dnf:
        name:
          - "git-{{ git_version }}*"
          - "podman-{{ podman_version }}*"
          - "python3-{{ python_version }}*"
          - mongodb-org
        state: present
      become: true

    - name: Enable and start MongoDB service
      ansible.builtin.systemd:
        name: mongod
        enabled: true
        state: started
      become: true

    - name: Download pinned oc CLI archive
      ansible.builtin.get_url:
        url: "{{ oc_cli_download_url }}"
        dest: "/tmp/openshift-client-linux-{{ oc_version }}.tar.gz"
        mode: "0644"

    - name: Extract oc binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/openshift-client-linux-{{ oc_version }}.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        mode: "0755"
      become: true

    # =========================================================================
    # 03. TOOLING VERIFICATION
    # =========================================================================
    - name: Check versions of all installed tools
      ansible.builtin.command: "{{ item }}"
      loop:
        - git --version
        - podman --version
        - python3 --version
        - oc version --client
        - mongod --version
      register: tool_versions
      changed_when: false

    - name: Display installed tool versions
      ansible.builtin.debug:
        msg: "{{ tool_versions.results | map(attribute='stdout_lines') | map('first') | list }}"

    # =========================================================================
    # 04. USER WORKSPACE & GIT REPOSITORY
    # =========================================================================
    - name: Clone the target git repository
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ git_dest }}"
        version: HEAD

    # =========================================================================
    # 05. AUTHENTICATION & LOGIN CHECKS
    # =========================================================================
    - name: Log in to the container registry with podman
      ansible.builtin.command:
        cmd: "podman login {{ podman_registry_url }} -u {{ podman_registry_username }} --password-stdin"
        stdin: "{{ podman_registry_password }}"
      no_log: true
      changed_when: false

    - name: Log in to the OpenShift cluster with oc
      ansible.builtin.command:
        cmd: "oc login {{ oc_api_url }} --token={{ oc_token }} --insecure-skip-tls-verify=false"
      no_log: true
      changed_when: false

    - name: Confirm oc login
      ansible.builtin.command: oc whoami
      register: oc_whoami
      changed_when: false

    - name: Show oc login identity
      ansible.builtin.debug:
        msg: "Successfully logged in as {{ oc_whoami.stdout }}"